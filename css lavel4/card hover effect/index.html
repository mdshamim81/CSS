<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Hover Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <img src="my profile image1.png" alt="man">
        <div class="desc">
            <h3>Md Shamim</h3>
            <p>Software Engineer</p>
        </div>
    </div>

    <div class="card">
        <img src="girl.jpg" id="girl" alt="woman">
        <div class="desc">
            <h3>Farhat Anam</h3>
            <p>Data Analyst</p>
        </div>
    </div>
</body>
</html>
